# Run CodeBox on your own machine with the same sandbox (isolate) as production.
#
#   docker compose -f docker-compose.local.yml up -d --build
#   curl http://localhost:2358/health
#
# Point the Calibr8 backend at it (env vars override backend/.env):
#   CODEBOX_URL=http://localhost:2358  CODEBOX_TOKEN=local-dev-token
#
# Worker CPU/concurrency default to the production values so timings are
# comparable; override with LOCAL_WORKER_CPUS / LOCAL_WORKER_CONCURRENCY.
name: codebox-local

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    # Loopback only: the token below is public (it is in this repository), so
    # the API must never be reachable from the LAN or the internet.
    ports:
      - "127.0.0.1:2358:3000"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      # Set CODEBOX_LOCAL_TOKEN (and the backend's CODEBOX_TOKEN) to a private
      # value; the default is public.
      - AUTH_TOKEN=${CODEBOX_LOCAL_TOKEN:-local-dev-token}
      # DNS-rebinding protection: only these Host headers are served.
      - ALLOWED_HOSTS=${CODEBOX_LOCAL_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],api,host.docker.internal}
      # Clients connect directly (no reverse proxy).
      - TRUST_PROXY=false
      - PORT=3000
      - BODY_LIMIT=50mb
      - RATE_LIMIT_MAX_REQUESTS=100000
      - BATCH_MAX_TESTCASES=200
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: node src/queue/worker.js
    # isolate needs cgroup v2 write access (Docker Desktop/WSL2 and Linux both work)
    privileged: true
    cgroup: host
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - EXECUTOR_TYPE=isolate
      - WORKER_CONCURRENCY=${LOCAL_WORKER_CONCURRENCY:-2}
      - BATCH_PARALLELISM=${LOCAL_WORKER_CONCURRENCY:-2}
      - DEFAULT_MEMORY_LIMIT=256000
      - MAX_MEMORY_LIMIT=512000
      - BUILD_CACHE_ENABLED=true
      - BUILD_CACHE_MAX_MB=512
      # Same as production: the Node.js worker drops root after cgroup setup.
      - WORKER_USER=${WORKER_USER-codebox}
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${LOCAL_WORKER_CPUS:-1.5}'
          memory: 4G
