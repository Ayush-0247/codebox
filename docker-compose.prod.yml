services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # DOMAIN is required: Caddy then serves HTTPS with an automatic
      # certificate. The API carries the CodeBox token, users' source code and
      # hidden testcase input, so plain HTTP on the server's IP is no longer
      # an option (SA-H3). For a private-network-only setup, put the backend
      # and CodeBox on the same private network instead of publishing ports.
      - "SITE_ADDRESS=${DOMAIN:?DOMAIN must be set to the hostname that points at this server (automatic HTTPS)}"
      # Must be non-empty: Caddy's header matcher fails to parse on a blank
      # value and the container crashloops with "malformed header matcher".
      - "METRICS_TOKEN=${METRICS_TOKEN:?METRICS_TOKEN must be set (generate one with openssl rand -hex 16)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          cpus: '${CADDY_CPUS:-0.25}'
          memory: ${CADDY_MEMORY:-128M}

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - "AUTH_TOKEN=${AUTH_TOKEN:?AUTH_TOKEN must be set - an empty token disables auth entirely}"
      - PORT=3000
      # The backend's largest request (multi-case harness) is ~4 MB; bodies
      # are only parsed after authentication (SA-M8).
      - BODY_LIMIT=${BODY_LIMIT:-8mb}
      # Exactly one proxy (Caddy) in front of the API: real client IPs for
      # the unauthenticated per-IP budget (SA-H4).
      - TRUST_PROXY=1
      # Per authenticated client (token).
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      # Per IP, for requests without a valid token; never shared with the
      # authenticated budget.
      - RATE_LIMIT_UNAUTHENTICATED_MAX=${RATE_LIMIT_UNAUTHENTICATED_MAX:-60}
      # Same result TTL as the worker (the API writes submission:/batch: keys too).
      - RESULT_CACHE_TTL=${RESULT_CACHE_TTL:-1800}
      - QUEUE_KEEP_COMPLETED_AGE=${QUEUE_KEEP_COMPLETED_AGE:-600}
      - QUEUE_KEEP_COMPLETED_COUNT=${QUEUE_KEEP_COMPLETED_COUNT:-100}
      - QUEUE_KEEP_FAILED_AGE=${QUEUE_KEEP_FAILED_AGE:-86400}
      - QUEUE_KEEP_FAILED_COUNT=${QUEUE_KEEP_FAILED_COUNT:-100}
      - BATCH_MAX_TESTCASES=${BATCH_MAX_TESTCASES:-200}
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS:-0.25}'
          memory: ${API_MEMORY:-256M}

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: node src/queue/worker.js
    privileged: true
    # isolate writes to /sys/fs/cgroup/cgroup.subtree_control; the host cgroup
    # namespace is required for that to take effect (see docker/worker/entrypoint.sh).
    cgroup: host
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - EXECUTOR_TYPE=isolate
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - DEFAULT_MEMORY_LIMIT=${DEFAULT_MEMORY_LIMIT:-256000}
      - MAX_MEMORY_LIMIT=${MAX_MEMORY_LIMIT:-512000}
      - RESULT_CACHE_TTL=${RESULT_CACHE_TTL:-1800}
      - QUEUE_KEEP_COMPLETED_AGE=${QUEUE_KEEP_COMPLETED_AGE:-600}
      - QUEUE_KEEP_COMPLETED_COUNT=${QUEUE_KEEP_COMPLETED_COUNT:-100}
      - QUEUE_KEEP_FAILED_AGE=${QUEUE_KEEP_FAILED_AGE:-86400}
      - QUEUE_KEEP_FAILED_COUNT=${QUEUE_KEEP_FAILED_COUNT:-100}
      - BUILD_CACHE_ENABLED=${BUILD_CACHE_ENABLED:-true}
      - BUILD_CACHE_MAX_MB=${BUILD_CACHE_MAX_MB:-512}
      # Testcases of one batch run in parallel, capped at the host's CPU count.
      - BATCH_PARALLELISM=${BATCH_PARALLELISM:-2}
      # The Node.js worker drops root after cgroup setup; sandboxes are still
      # created by the setuid isolate binary (docker/worker/entrypoint.sh).
      # Set WORKER_USER= (empty) to run it as root as before.
      - WORKER_USER=${WORKER_USER-codebox}
      # Program output kept per run (Redis holds every byte until deleted).
      - MAX_OUTPUT_CHARS=${MAX_OUTPUT_CHARS:-65536}
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          # Must not exceed the host's vCPU count or Docker refuses to start it.
          cpus: '${WORKER_CPUS:-1.5}'
          memory: ${WORKER_MEMORY:-4G}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    restart: always
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.25}'
          memory: ${REDIS_MEMORY:-384M}

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}'
    restart: always
    deploy:
      resources:
        limits:
          cpus: '${PROMETHEUS_CPUS:-0.25}'
          memory: ${PROMETHEUS_MEMORY:-512M}

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set (no default admin password)}"
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: always
    deploy:
      resources:
        limits:
          cpus: '${GRAFANA_CPUS:-0.25}'
          memory: ${GRAFANA_MEMORY:-256M}

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
